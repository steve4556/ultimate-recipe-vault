<!DOCTYPE html>
<html>
<body style="background:#1c212a; color:#fff; font-family:sans-serif; padding:20px;">
<button onclick="downloadVaultIcons()" style="font-size:18px; padding:12px 20px; background:#d4af37; color:#1c212a; font-weight:bold; border:none; border-radius:6px; cursor:pointer;">Download Custom Vault Door Icons</button>
<script>
function drawVaultDoor(size) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const cx = size / 2, cy = size / 2;

  ctx.fillStyle = '#1c212a';
  ctx.fillRect(0, 0, size, size);

  ctx.strokeStyle = '#d4af37';
  ctx.lineWidth = size * 0.04;
  ctx.strokeRect(size * 0.06, size * 0.06, size * 0.88, size * 0.88);

  ctx.beginPath();
  ctx.arc(cx, cy, size * 0.34, 0, Math.PI * 2);
  ctx.fillStyle = '#2d3238';
  ctx.fill();
  ctx.lineWidth = size * 0.045;
  ctx.strokeStyle = '#d4af37';
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(cx, cy, size * 0.22, 0, Math.PI * 2);
  ctx.lineWidth = size * 0.015;
  ctx.strokeStyle = '#848d9e';
  ctx.stroke();

  ctx.fillStyle = '#d4af37';
  new Array(-1, 1).forEach(dir => {
    new Array(-0.14, 0, 0.14).forEach(offsetY => {
      ctx.fillRect(cx + dir * size * 0.31 - size * 0.03, cy + offsetY * size - size * 0.018, size * 0.06, size * 0.036);
    });
  });

  ctx.strokeStyle = '#d4af37';
  ctx.lineWidth = size * 0.025;
  for (let i = 0; i < 6; i++) {
    const angle = (i * Math.PI) / 3;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(angle) * size * 0.16, cy + Math.sin(angle) * size * 0.16);
    ctx.stroke();
  }

  ctx.beginPath();
  ctx.arc(cx, cy, size * 0.055, 0, Math.PI * 2);
  ctx.fillStyle = '#d4af37';
  ctx.fill();

  return c.toDataURL('image/png');
}

function downloadVaultIcons() {
  const sizes = new Array(192, 512);
  sizes.forEach((size, idx) => {
    setTimeout(() => {
      const a = document.createElement('a');
      a.download = `icon-${size}.png`;
      a.href = drawVaultDoor(size);
      a.click();
    }, idx * 500);
  });
}
</script>
</body>
</html>
